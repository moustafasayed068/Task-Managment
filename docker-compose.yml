version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: taskmanagement-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  app:
    build: .
    container_name: taskmanagement-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

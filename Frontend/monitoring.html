<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1300px;
            margin: auto;
        }

        .header {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat {
            font-size: 3rem;
            font-weight: bold;
            color: #007bff;
            margin: 10px 0;
        }

        .label {
            color: #666;
            font-size: 1.1rem;
        }

        .log {
            padding: 14px;
            margin: 10px 0;
            background: #f8f9fa;
            border-left: 5px solid #28a745;
            border-radius: 8px;
            text-align: left;
        }

        button {
            padding: 12px 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📊 Task Management Monitoring Dashboard</h1>
            <p>Live Application Metrics</p>
        </div>

        <div class="grid">
            <div class="card">
                <h3>System Health</h3>
                <p id="health" style="color:green; font-size:1.4rem;">Loading...</p>
            </div>
            <div class="card">
                <h3>Total Requests</h3>
                <p class="stat" id="requests">0</p>
            </div>
            <div class="card">
                <h3>Error Rate</h3>
                <p class="stat" id="errors">0%</p>
            </div>
            <div class="card">
                <h3>Uptime</h3>
                <p id="uptime" style="font-size:1.5rem; color:#333;">--</p>
            </div>
        </div>

        <div class="card">
            <h3>Recent Logs</h3>
            <button onclick="loadLogs()">🔄 Refresh Logs</button>
            <div id="logs" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script>
        const API = "http://127.0.0.1:8000";

        async function refreshDashboard() {
            try {
                const [healthRes, statsRes] = await Promise.all([
                    fetch(`${API}/monitoring/health`),
                    fetch(`${API}/monitoring/stats`)
                ]);

                const health = await healthRes.json();
                const stats = await statsRes.json();

                document.getElementById('health').innerHTML = `✅ Healthy | Uptime: ${health.uptime || 'N/A'}`;
                document.getElementById('requests').textContent = stats.total_requests || 0;
                document.getElementById('errors').textContent = (stats.error_rate || 0) + "%";
                document.getElementById('uptime').textContent = stats.uptime || "N/A";

            } catch (e) {
                document.getElementById('health').innerHTML = "❌ Cannot connect to backend";
                console.error(e);
            }
        }

        async function loadLogs() {
            try {
                const res = await fetch(`${API}/monitoring/logs?limit=10`);
                const data = await res.json();

                let html = "";
                if (data.recent_logs && data.recent_logs.length > 0) {
                    html = data.recent_logs.map(log => `
            <div class="log">
              <small>${log.time}</small> <strong>[${log.level}]</strong> ${log.message}
            </div>
          `).join('');
                } else {
                    html = "<p>No logs available yet.</p>";
                }
                document.getElementById('logs').innerHTML = html;
            } catch (e) {
                document.getElementById('logs').innerHTML = "<p style='color:red'>Error loading logs</p>";
            }
        }

        // Refresh every 4 seconds
        setInterval(refreshDashboard, 4000);
        refreshDashboard();
        loadLogs();
    </script>
</body>

</html>

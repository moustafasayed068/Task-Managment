<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow • Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>🌈 TaskFlow</h1>
            <p>Stay Organized • Get Things Done</p>
        </header>

        <!-- Auth Section -->
        <div id="auth-section" class="auth-card">
            <h2>🔑 Welcome Back</h2>
            <input type="text" id="username" value="admin" placeholder="Username">
            <input type="password" id="password" value="admin123" placeholder="Password">
            <button onclick="login()" class="btn-primary">Login</button>
            <p id="auth-message"></p>
        </div>

        <!-- Main App -->
        <div id="main-app" style="display: none;">
            <div class="top-bar">
                <h2>Dashboard</h2>
                <button onclick="logout()" class="btn-danger">Logout</button>
            </div>

            <div class="grid-2">
                <!-- Create Project -->
                <div class="card colorful-card">
                    <h3>➕ New Project</h3>
                    <input type="text" id="proj-name" placeholder="Project Name">
                    <input type="text" id="proj-desc" placeholder="Description (optional)">
                    <button onclick="createProject()" class="btn-success">Create Project</button>
                </div>

                <!-- Create Task -->
                <div class="card colorful-card">
                    <h3>➕ New Task</h3>
                    <input type="text" id="task-title" placeholder="Task Title">
                    <input type="text" id="task-desc" placeholder="Description">
                    <select id="task-status">
                        <option value="todo">📋 To Do</option>
                        <option value="in_progress">🔄 In Progress</option>
                        <option value="done">✅ Done</option>
                    </select>
                    <input type="number" id="project-id" value="1" placeholder="Project ID">
                    <button onclick="createTask()" class="btn-success">Create Task</button>
                </div>
            </div>

            <div class="section">
                <h2>📂 Projects</h2>
                <button onclick="loadProjects()" class="btn-secondary">Refresh</button>
                <div id="projects-list" class="list"></div>
            </div>

            <div class="section">
                <h2>📋 Tasks</h2>
                <button onclick="loadTasks()" class="btn-secondary">Refresh</button>
                <div id="tasks-list" class="list"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
